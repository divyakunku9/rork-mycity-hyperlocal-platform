# Builds the Android app on GitHub whenever code is pushed.
# To get the app: open the repo's "Actions" tab → the latest "Build Android app" run →
# download "app-debug-apk" at the bottom, unzip it, and install the .apk on an Android phone.
name: Build Android app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-mycity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-mycity/app/build/outputs/apk/debug/*.apk
          retention-days: 14
