# Installs the app on an Android emulator and walks through every screen (see ci/ui_smoke.py).
# Screenshots and visible text are printed to the job log.
name: App smoke test (emulator)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android-mycity/**"
      - "ci/**"
      - ".github/workflows/ui-test.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug app
        working-directory: android-mycity
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install image tools
        run: sudo apt-get install -y imagemagick >/dev/null 2>&1 || true

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android-mycity/app/build/outputs/apk/debug/app-debug.apk
            python3 ci/ui_smoke.py
